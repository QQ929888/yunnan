<script>

<div class="container">

<script>
    // 轮播图（左右同步10秒）
    const sliderImages = ["收藏1.jpg",
        "收藏2.jpg",
        "收藏3.jpg",
        "收藏4.jpg",
        "收藏5.jpg",
        "收藏6.jpg"];
    let currentIndex = 0;
    const leftSlider = document.getElementById("leftSlider");
    const rightSlider = document.getElementById("rightSlider");

    function changeSlider() {
        currentIndex = (currentIndex + 1) % sliderImages.length;
        leftSlider.src = sliderImages[currentIndex];
        rightSlider.src = sliderImages[currentIndex];
    }
    setInterval(changeSlider, 10000);

    // ======================
    // 收藏页核心（完美版）
    // ======================
    let plantFavorites = JSON.parse(localStorage.getItem("plantFavorites") || "[]");
    let animalFavorites = JSON.parse(localStorage.getItem("animalFavorites") || "[]");

    const plantListEl = document.getElementById("plantList");
    const animalListEl = document.getElementById("animalList");
    const plantCountEl = document.getElementById("plantCount");
    const animalCountEl = document.getElementById("animalCount");

    // 更新数量
    function updateCounts() {
        plantCountEl.textContent = plantFavorites.length;
        animalCountEl.textContent = animalFavorites.length;
    }

    // 渲染列表（显示名字 + 可跳转）
    function renderList() {
        // 植物列表
        plantListEl.innerHTML = "";
        plantFavorites.forEach(item => {
            let div = document.createElement("div");
            div.className = "collect-item";
            div.textContent = item.title;
            div.onclick = () => window.location.href = item.url;
            plantListEl.appendChild(div);
        });

        // 动物列表
        animalListEl.innerHTML = "";
        animalFavorites.forEach(item => {
            let div = document.createElement("div");
            div.className = "collect-item";
            div.textContent = item.title;
            div.onclick = () => window.location.href = item.url;
            animalListEl.appendChild(div);
        });

        updateCounts();
    }

    // 展开/收起
    document.getElementById("plantCategory").onclick = () => {
        plantListEl.classList.toggle("show");
    };
    document.getElementById("animalCategory").onclick = () => {
        animalListEl.classList.toggle("show");
    };

    // 页面加载时渲染
    renderList();
</script>
<script>
    // 1. 获取DOM元素（必须先获取，再绑定事件！）
    const searchInput = document.querySelector('.search-input');
    const searchSuggestions = document.querySelector('.search-suggestions');
    let activeIndex = -1; // 键盘上下键选中的索引

    // 2. 输入框输入事件：请求后端接口
    searchInput.addEventListener('input', async function() {
        const keyword = this.value.trim();
        searchSuggestions.innerHTML = '';
        activeIndex = -1;

        // 输入为空，隐藏下拉
        if (!keyword) {
            searchSuggestions.style.display = 'none';
            return;
        }

        try {
            // 向后端接口发送请求
            let res = await fetch(`http://47.108.20.237:3000/api/search?keyword=${encodeURIComponent(keyword)}`);
            let filtered = await res.json();

            // 无结果
            if (filtered.length === 0) {
                searchSuggestions.innerHTML = '<li style="color:#999;">暂无结果</li>';
                searchSuggestions.style.display = 'block';
                return;
            }

            // 渲染联想列表
            filtered.forEach((item) => {
                const li = document.createElement('li');
                li.textContent = item.name;
                li.dataset.url = item.url;
                li.addEventListener('click', () => {
                    window.location.href = item.url;
                    searchSuggestions.style.display = 'none';
                    searchInput.value = '';
                });
                searchSuggestions.appendChild(li);
            });

            searchSuggestions.style.display = 'block';

        } catch (err) {
            console.log('接口请求失败：', err);
            searchSuggestions.innerHTML = '<li style="color:#999;">加载失败</li>';
            searchSuggestions.style.display = 'block';
        }
    });

    // 3. 键盘上下键选择联想项
    searchInput.addEventListener('keydown', function(e) {
        const items = searchSuggestions.querySelectorAll('li');
        if (!items.length) return;

        // 上键
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = activeIndex > 0 ? activeIndex - 1 : items.length - 1;
            updateActiveItem(items);
        }
        // 下键
        else if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = activeIndex < items.length - 1 ? activeIndex + 1 : 0;
            updateActiveItem(items);
        }
        // 回车跳转
        else if (e.key === 'Enter' && activeIndex >= 0) {
            const url = items[activeIndex].dataset.url;
            if (url) window.location.href = url;
            searchSuggestions.style.display = 'none';
            searchInput.value = '';
        }
    });

    // 更新选中项样式并自动滚动
    function updateActiveItem(items) {
        items.forEach((item, index) => {
            item.classList.toggle('active', index === activeIndex);
            if (index === activeIndex) {
                item.scrollIntoView({ block: 'nearest' });
            }
        });
    }

    // 点击页面其他地方关闭下拉框
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            searchSuggestions.style.display = 'none';
        }
    });
</script>
