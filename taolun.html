<script>
    const userBtn = document.querySelector('.user-btn');
    const dropdown = document.querySelector('.user-dropdown');

    userBtn.addEventListener('click', () => {
        dropdown.classList.toggle('active');
    });

    // 点击页面其他地方关闭
    document.addEventListener('click', (e) => {

            dropdown.classList.remove('active');

</script>

<!-- 聊天容器 -->
<div class="chat-container">
    <!-- 聊天内容区（可滚动） -->
    <div class="chat-content" id="chatContent">


    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <input type="file" id="fileInput" accept="image/*">
        <textarea class="input-box" id="messageInput" placeholder="输入消息..."></textarea>
        <!-- 【关键】附件按钮：ID 必须是 attachBtn -->
        <button class="attach-btn" id="attachBtn">+</button>
        <!-- 【关键】发送按钮：ID 必须是 sendBtn -->
        <button class="send-btn" id="sendBtn">发送</button>
    </div>
</div>

<script>
    const chatContent = document.getElementById('chatContent');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const attachBtn = document.getElementById('attachBtn');

    // 🔴 改动点1：定义你的用户名，和数据库里的完全一致
    const MY_USERNAME = '我自己';

    // 🔴 改动点2：渲染消息时，根据用户名动态添加class
    // 🔴 改动点：完整的消息渲染函数，包含用户名、样式和图片
    // 原来的 renderMessage 整段删掉，换成下面这个
    function renderMessage(msg) {
        const isMine = msg.username === MY_USERNAME;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-item ${isMine ? 'message-mine' : 'message-other'}`;

        let imageHtml = '';
        if (msg.image) {
            // 🔴 改动1：图片路径保持你现在能用的写法
            imageHtml = `<img src="http://47.108.20.237:3000${msg.image}" alt="聊天图片" class="chat-image">`;
        }

        // 🔴 改动2：用户名放在气泡内部上方，不跑出去
        messageDiv.innerHTML = `
        <div class="message-wrapper">
            <div class="message-bubble">
                 <div class="chat-username">${msg.username}</div>
                 ${imageHtml}
                 <p>${msg.content || ''}</p >
            </div>
        </div>
        `;

    chatContent.appendChild(messageDiv);
    chatContent.scrollTop = chatContent.scrollHeight;
}

    // 加载历史消息
    async function loadMessages() {
        try {
            const res = await fetch('http://47.108.20.237:3000/api/messages');
            const data = await res.json();
            if (data.code === 0) {
                chatContent.innerHTML = '';
                data.data.forEach(msg => renderMessage(msg));
            }
        } catch (err) {
            console.error('加载消息失败:', err);
        }
    }

    // 上传图片
    async function uploadImage(file) {
        const formData = new FormData();
        formData.append('image', file);
        try {
            const res = await fetch('http://47.108.20.237:3000/api/upload', {
                method: 'POST',
                body: formData
            });
            const result = await res.json();
            return result.code === 0 ? result.url : null;
        } catch (err) {
            return null;
        }
    }

    // 发送消息
    async function sendMessage() {
        const content = messageInput.value.trim();
        const file = fileInput.files[0];
        let imageUrl = null;

        if (file) {
            imageUrl = await uploadImage(file);
        }

        try {
            const res = await fetch('http://47.108.20.237:3000/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: MY_USERNAME, // 🔴 改动点3：发送时带上正确的用户名
                    content: content,
                    image: imageUrl
                })
            });
            const sendRes = await res.json();
            if (sendRes.code === 0) {
                messageInput.value = '';
                fileInput.value = '';
                loadMessages();
            }
        } catch (err) {
            console.error('发送失败:', err);
        }
    }

    // 绑定事件
    sendBtn.addEventListener('click', sendMessage);
    attachBtn.addEventListener('click', () => fileInput.click());
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 页面加载
    window.onload = loadMessages;
</script>


<script>
    // 1. 获取DOM元素（必须先获取，再绑定事件！）
    const searchInput = document.querySelector('.search-input');
    const searchSuggestions = document.querySelector('.search-suggestions');
    let activeIndex = -1; // 键盘上下键选中的索引

    // 2. 输入框输入事件：请求后端接口
    searchInput.addEventListener('input', async function() {
        const keyword = this.value.trim();
        searchSuggestions.innerHTML = '';
        activeIndex = -1;

        // 输入为空，隐藏下拉
        if (!keyword) {
            searchSuggestions.style.display = 'none';
            return;
        }

        try {
            // 向后端接口发送请求
            let res = await fetch(`http://47.108.20.237:3000/api/search?keyword=${encodeURIComponent(keyword)}`);
            let filtered = await res.json();

            // 无结果
            if (filtered.length === 0) {
                searchSuggestions.innerHTML = '<li style="color:#999;">暂无结果</li>';
                searchSuggestions.style.display = 'block';
                return;
            }

            // 渲染联想列表
            filtered.forEach((item) => {
                const li = document.createElement('li');
                li.textContent = item.name;
                li.dataset.url = item.url;
                li.addEventListener('click', () => {
                    window.location.href = item.url;
                    searchSuggestions.style.display = 'none';
                    searchInput.value = '';
                });
                searchSuggestions.appendChild(li);
            });

            searchSuggestions.style.display = 'block';

        } catch (err) {
            console.log('接口请求失败：', err);
            searchSuggestions.innerHTML = '<li style="color:#999;">加载失败</li>';
            searchSuggestions.style.display = 'block';
        }
    });

    // 3. 键盘上下键选择联想项
    searchInput.addEventListener('keydown', function(e) {
        const items = searchSuggestions.querySelectorAll('li');
        if (!items.length) return;

        // 上键
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = activeIndex > 0 ? activeIndex - 1 : items.length - 1;
            updateActiveItem(items);
        }
        // 下键
        else if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = activeIndex < items.length - 1 ? activeIndex + 1 : 0;
            updateActiveItem(items);
        }
        // 回车跳转
        else if (e.key === 'Enter' && activeIndex >= 0) {
            const url = items[activeIndex].dataset.url;
            if (url) window.location.href = url;
            searchSuggestions.style.display = 'none';
            searchInput.value = '';
        }
    });

    // 更新选中项样式并自动滚动
    function updateActiveItem(items) {
        items.forEach((item, index) => {
            item.classList.toggle('active', index === activeIndex);
            if (index === activeIndex) {
                item.scrollIntoView({ block: 'nearest' });
            }
        });
    }

    // 点击页面其他地方关闭下拉框
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            searchSuggestions.style.display = 'none';
        }
    });
</script>
