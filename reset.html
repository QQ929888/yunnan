<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>找回密码</title>
  <link rel="stylesheet" href="sty4.css">
  <style>
    /* 严格和原页面格式统一，按钮间距、输入框大小完全一致 */
    #sendCodeBtn {
      margin: 12px 0 !important;
    }
  </style>


  <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>

    <style>
        /* 自定义Coze聊天窗口样式，适配你的网站风格 */
        #coze-webchat {
            position: fixed !important;
            bottom: 25px !important;
            right: 25px !important;
            z-index: 9999 !important;
        }
        /* 🔥 放大悬浮按钮 + 主题美化（完全保留你的设置） */
        #coze-webchat .coze-webchat-float-button {
            width: 100px !important;
            height: 100px !important;
            background-color: #2E7D32 !important;
            border-radius: 50% !important;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4) !important;
            transition: all 0.3s ease !important;
        }
        /* 鼠标悬浮时轻微放大（完全保留） */
        #coze-webchat .coze-webchat-float-button:hover {
            transform: scale(1.08) !important;
        }
        /* 聊天窗口主题色统一 */
        #coze-webchat .coze-webchat-window-header {
            background-color: #2E7D32 !important;
        }
    </style>


</head>
<body>
<div class="content">
  <div class="login-content">
    <a href=" " class="banner-box"></a >

    <div class="login-box">
      <h1>找回密码</h1>
      <!-- 账号输入框 -->
      <input type="text" placeholder="请输入你的账号" id="username">
      <!-- 邮箱输入框 -->
      <input type="email" placeholder="请输入注册邮箱" id="email">
      <!-- 发送验证码按钮（新增，格式统一） -->
      <button class="login-btn" id="sendCodeBtn">发送验证码</button>
      <!-- 验证码输入框（新增，格式统一） -->
      <input type="text" placeholder="请输入邮箱验证码" id="code">
      <!-- 新密码输入框 -->
      <input type="password" placeholder="请输入新密码" id="newPwd">
      <!-- 重置密码按钮 -->
      <button class="login-btn" id="resetBtn">重置密码</button>
      <p class="switch"><a href="index1.html" style="color:#0077ff;text-decoration:none;">返回登录</a ></p >
    </div>
  </div>
</div>

<script>
  // 1. 发送验证码接口（只改了这1行地址！）
  document.getElementById('sendCodeBtn').addEventListener('click', async ()=>{
    let email = document.getElementById('email').value.trim()
    if(!email){
      alert("请先输入注册邮箱！")
      return
    }

    // ✅ 唯一修改：把服务器地址改成本地后端地址
    let res = await fetch("http://47.108.20.237:3001/api/send-code", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ email: email })
    })
    let data = await res.json()
    alert(data.msg)
  })

  // 2. 重置密码接口（只改了这1行地址！）
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    let username = document.getElementById('username').value.trim()
    let email = document.getElementById('email').value.trim()
    let code = document.getElementById('code').value.trim()
    let newPwd = document.getElementById('newPwd').value.trim()

    // 前端完整校验
    if(!username || !email || !code || !newPwd){
      alert("请填写完整信息！")
      return
    }

    // ✅ 唯一修改：把服务器地址改成本地后端地址
    let res = await fetch("http://47.108.20.237:3001/api/reset-pwd", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email: email,
        code: code,
        newPwd: newPwd
      })
    })
    let data = await res.json()
    alert(data.msg)
    // 重置成功自动返回登录页
    if(data.code === 200){
      window.location.href = "index1.html"
    }
  })
</script>


<script src="./index.js"></script>
<!-- 嵌入Coze智能体聊天窗口 + ✅ 原生title提示（光标一放必显示） -->
<script>
  new CozeWebSDK.WebChatClient({
    config: {
      bot_id: '7634345885346545679',
    },
    componentProps: {
      title: '滇境生灵智能助手',
      layout: "float",
      tooltip: "滇境生灵智能助手"  // ✅ 这里直接设置原生提示，100%生效
    },
    auth: {
      type: 'token',
      token: 'pat_EtNINqzwFkGGlgx7j8NbVaMS2oGRNMKBsAIWWVUmdzjQeku0KyoxHPwEvFY3wsd3',
      onRefreshToken: function () {
        return 'pat_EtNINqzwFkGGlgx7j8NbVaMS2oGRNMKBsAIWWVUmdzjQeku0KyoxHPwEvFY3wsd3'
      }
    }
  });

  // ✅ 强制给按钮加上原生title，兜底必生效
  setTimeout(() => {
    const btn = document.querySelector('.coze-webchat-float-button');
    if(btn) btn.title = "滇境生灵智能助手";
  }, 1000);
</script>


</body>
</html>
